<style>
:root{--bg:#fbfbfa;--card:#fff;--text:#151513;--muted:#6d6a63;--line:#e6e3dc;--acc:#e8620c;--accsoft:#fdeee3;--ok:#22c55e;--btn:#151513;--btnt:#fff;--dim:#b9b5ab;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161512;--card:#201f1b;--text:#f1efe9;--muted:#9c978c;--line:#302e29;--acc:#ff8a3d;--accsoft:#332519;--btn:#f1efe9;--btnt:#161512;--dim:#5f5b52}}
:root[data-theme="dark"]{--bg:#161512;--card:#201f1b;--text:#f1efe9;--muted:#9c978c;--line:#302e29;--acc:#ff8a3d;--accsoft:#332519;--btn:#f1efe9;--btnt:#161512;--dim:#5f5b52}
*{box-sizing:border-box}
html{scroll-behavior:smooth;height:auto}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f);font-size:16px;line-height:1.6;transition:background .4s,color .4s;-webkit-font-smoothing:antialiased}
html[lang=bn] body{line-height:1.8}
a{color:inherit;text-decoration:none}
button{font-family:inherit;color:inherit;cursor:pointer}
.wrap{max-width:980px;margin:0 auto;padding:0 20px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px)}
nav .wrap{display:flex;align-items:center;gap:12px;height:68px;position:relative}
.logo{font-weight:700;font-size:20px;letter-spacing:-.02em;margin-right:auto}.logo i{color:var(--acc);font-style:normal}
.links{display:flex;gap:6px;font-size:14.5px;color:var(--muted)}
.links a{padding:6px 12px;border-radius:99px;transition:color .2s,background .2s}.links a:hover{color:var(--text)}
.links a.on,.menu a.on{color:var(--acc);background:var(--accsoft)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:99px;font-size:13px;font-weight:600;color:var(--muted);transition:background .25s,color .25s}
.seg button.on{background:var(--btn);color:var(--btnt)}
.ic{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;transition:transform .25s,border-color .2s}
.ic:hover{transform:translateY(-2px);border-color:var(--acc)}
.dots{display:none}
.menu{position:absolute;right:20px;top:calc(100% - 6px);min-width:200px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:8px;display:flex;flex-direction:column;opacity:0;transform:translateY(-6px) scale(.98);transform-origin:top right;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:0 18px 40px -18px rgba(0,0,0,.45)}
.menu.open{opacity:1;transform:none;pointer-events:auto}
.menu a{padding:11px 14px;border-radius:12px;font-size:15px}.menu a:hover{background:var(--accsoft)}
@media(max-width:860px){.links{display:none}.dots{display:grid}}
@media(min-width:861px){.menu{display:none}}
main{transition:opacity .2s}.fade main{opacity:0}
.view{display:none;padding:44px 0 20px}
.view.on{display:block}
.view.leave{opacity:0;transform:translateY(8px);transition:opacity .18s,transform .18s}
.view.on>*{animation:vin .6s backwards}
.view.on>*:nth-child(2){animation-delay:.07s}.view.on>*:nth-child(3){animation-delay:.14s}.view.on>*:nth-child(4){animation-delay:.21s}.view.on>*:nth-child(5){animation-delay:.28s}
@keyframes vin{from{opacity:0;transform:translateY(14px)}}
.view>.card{margin-bottom:14px}
#v-home{min-height:calc(100vh - 140px);min-height:calc(100svh - 140px);display:none;flex-direction:column;justify-content:center;padding:20px 0 40px}
#v-home.on{display:flex}
h1{font-size:clamp(34px,6.2vw,60px);line-height:1.3;letter-spacing:-.025em;margin:0 0 26px;font-weight:700}
html[lang=bn] h1{letter-spacing:0;line-height:1.35}
.dim{color:var(--dim)}.acc{color:var(--acc)}
.kick{color:var(--muted);font-size:15px;font-weight:500;margin:0 0 22px}
.tile{display:inline-grid;place-items:center;width:1.15em;height:1.15em;border-radius:.32em;background:var(--btn);color:var(--btnt);vertical-align:-.2em;box-shadow:0 14px 28px -12px rgba(0,0,0,.55)}
.tile svg{width:.58em;height:.58em}
.work{display:flex;flex-wrap:wrap;align-items:center;gap:14px 34px;margin:6px 0 34px;color:var(--muted);font-size:15px;font-weight:500}
.work>span{display:inline-flex;align-items:center;gap:10px}
.mini{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;background:color-mix(in srgb,var(--text) 8%,transparent);color:var(--text)}
.mini svg{width:18px;height:18px}
.intro{max-width:620px}.intro p{margin:0 0 18px;font-size:17px;line-height:1.75}.intro p+p{font-size:15.5px;color:var(--muted)}
.intro em{font-style:italic}.num{color:var(--acc);font-variant-numeric:tabular-nums}
.ph{display:inline-block;width:1.15em;height:1.15em;border-radius:.3em;overflow:hidden;vertical-align:-.2em;border:3px solid #f4a261;box-shadow:0 10px 26px -10px rgba(0,0,0,.4);cursor:pointer;position:relative;z-index:1;transform-origin:25% 40%;transition:transform .6s cubic-bezier(.2,.8,.2,1),box-shadow .6s;-webkit-tap-highlight-color:transparent}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.z{transform:scale(4.6) rotate(-6deg);z-index:30;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
@media(hover:hover){.ph:hover{transform:scale(4.6) rotate(-6deg);z-index:30;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}}
@media(max-width:600px){.ph.z{transform:scale(3.3) rotate(-6deg)}}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--btn);color:var(--btnt);border:0;border-radius:99px;padding:13px 26px;font-size:15px;font-weight:600;transition:transform .25s,box-shadow .25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 28px -12px rgba(0,0,0,.45)}
.btn.s{padding:9px 18px;font-size:13.5px;background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn.s:hover{border-color:var(--acc)}
.open{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 14px;font-size:13px}
.open b{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pu 2s infinite}
@keyframes pu{0%{box-shadow:0 0 0 0 var(--ok)}70%,100%{box-shadow:0 0 0 8px transparent}}
.soc{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.soc button{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;font-size:12px;font-weight:700;transition:transform .25s,border-color .2s,background .2s}
.soc button:hover{transform:translateY(-3px);border-color:var(--acc);background:var(--accsoft)}
.soc svg{width:20px;height:20px;fill:currentColor}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;transition:transform .35s,border-color .25s,background .4s}
.card:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--acc) 50%,var(--line))}
.tag{display:inline-block;font-size:11.5px;font-weight:600;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:3px 11px;color:var(--muted);letter-spacing:.02em}
.card h3{margin:10px 0 6px;font-size:19px;letter-spacing:-.01em}
.card p{margin:0;color:var(--muted);font-size:14.5px}
h2{font-size:clamp(28px,5vw,40px);letter-spacing:-.02em;margin:0 0 6px;font-weight:600}
.sub{color:var(--muted);margin:0 0 22px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.chips span{font-size:13px;border:1px solid var(--line);border-radius:99px;padding:5px 13px;background:var(--bg);transition:border-color .2s,transform .2s}
.chips span:hover{border-color:var(--acc);transform:translateY(-1px)}
.fl{display:grid;grid-template-columns:max-content 1fr;gap:10px 24px;margin:18px 0 0;font-size:14.5px}
.fl dt{color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;padding-top:2px}.fl dd{margin:0}
.sg{margin-top:14px}.sg small{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.sg .chips{margin-top:6px}
.mq{overflow:hidden;margin:0 0 14px;padding:14px 0;border-block:1px solid var(--line);-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.mqt{display:flex;gap:10px;width:max-content;animation:mq 30s linear infinite}
.mqt span{font-size:13px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 16px;white-space:nowrap}
@keyframes mq{to{transform:translateX(-50%)}}
.car{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 16px;scrollbar-width:thin;cursor:grab}
.pcard{flex:0 0 250px;scroll-snap-align:start;cursor:pointer;padding:0;overflow:hidden}
.pcard h3{margin:14px 0 6px;padding:0 18px}.pcard p{padding:0 18px 18px}
.pcard.on{border-color:var(--acc)}
.thumb{position:relative;aspect-ratio:16/10;background:var(--accsoft);display:grid;place-items:center;font-size:44px;font-weight:700;color:var(--acc);overflow:hidden}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s}
.pcard:hover .thumb img{transform:scale(1.07)}
.flag{font-size:11px;color:var(--acc);border:1px solid var(--acc);border-radius:99px;padding:1px 8px;margin-left:8px;vertical-align:middle;font-weight:600}
.det{padding:0;overflow:hidden}
.det .dt{aspect-ratio:16/6}.det .db{padding:22px}.det h3{margin:0 0 6px}
.det ul{margin:12px 0;padding-left:20px;color:var(--muted);font-size:14.5px}
.cw{list-style:none;margin:12px 0 0;padding:0}.cw li{padding:14px 0;border-top:1px solid var(--line);font-size:14.5px;color:var(--muted)}.cw li:first-child{border:0}.cw b{color:var(--text)}.cw code{font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 7px}.cw .btn{margin-top:8px}
.cd4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.cd4>div{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:14px 6px;text-align:center}
.cd4 b{display:block;font-size:clamp(24px,6vw,40px);font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.cd4 small{color:var(--muted);font-size:12px}
.card p+p{margin-top:4px}
.tl{list-style:none;margin:12px 0 0;padding:0 0 0 16px;border-left:2px solid var(--line)}
.tl>li{position:relative;margin-bottom:18px;font-size:14.5px}
.tl>li::before{content:'';position:absolute;left:-23px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--acc)}
.tl small{display:block;color:var(--muted);font-size:12px}
.tl ul{margin:6px 0 0;padding-left:16px;color:var(--muted)}.tl ul li{margin:0 0 3px;font-size:13.5px}
form{display:grid;gap:12px;max-width:500px;margin-bottom:22px}
input,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 16px;font:inherit;color:var(--text);transition:border-color .2s}
input:focus,textarea:focus{outline:none;border-color:var(--acc)}
#st{font-size:13.5px;min-height:20px;margin:0}
footer{padding:30px 0 60px;color:var(--muted);font-size:13px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>

  $("#also").innerHTML=CW.map(c=>`<li><b>${c.n}</b> <code>${c.t}</code><br>${c.d[lang]}${c.g?`<br><a class="btn s" href="${c.g}" target="_blank" rel="noopener noreferrer">${t.repo}</a>`:""}</li>`).join("");
  $("#car").innerHTML=P.map(p=>`<div class="card pcard">${th(p)}<h3>${p.n}${p.ong?`<span class="flag">${t.ong}</span>`:""}</h3><p>${p.d[lang]}</p></div>`).join("");
  const sp=i=>{cur=i;const p=P[i];$$(".pcard").forEach((c,j)=>c.classList.toggle("on",j===i));$("#det").innerHTML=`${th(p,"dt")}<div class="db"><h3>${p.n}${p.ong?`<span class="flag">${t.ong}</span>`:""}</h3><p>${p.d[lang]}</p><ul>${p.h[lang].map(x=>`<li>${x}</li>`).join("")}</ul><div class="chips">${p.t.map(x=>`<span>${x}</span>`).join("")}</div><div class="row" style="margin-top:16px">${p.u?`<a class="btn" href="${p.u}" target="_blank" rel="noopener noreferrer">${t.demo}</a>`:""}${p.g?`<a class="btn s" href="${p.g}" target="_blank" rel="noopener noreferrer">${t.repo}</a>`:""}</div></div>`};
  $$(".pcard").forEach((c,i)=>c.addEventListener("click",()=>sp(i)));sp(cur);
  $$("[data-l]").forEach(b=>b.classList.toggle("on",b.dataset.l===lang));
  root.lang=lang;tick();
}
function setLang(l){
  if(l===lang)return;lang=l;store("lang",l);
  document.body.classList.add("fade");
  setTimeout(()=>{render();document.body.classList.remove("fade")},180);
}
function setTheme(m){root.dataset.theme=m;$("#th").innerHTML=m==="dark"?SUN:MOON;store("theme",m)}

/* pages: one view per hash, e.g. #about */
function closeMenu(){$("#menu").classList.remove("open");$("#mb").setAttribute("aria-expanded","false")}
function route(){
  let n=location.hash.slice(1);if(!NAV.includes(n))n="home";
  const next=$("#v-"+n),now=$(".view.on");
  $$("#links a,#menu a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+n));
  closeMenu();
  if(now===next)return;
  if(now){now.classList.add("leave");setTimeout(()=>{$$(".view").forEach(v=>v.classList.remove("on","leave"));next.classList.add("on");scrollTo(0,0)},180)}
  else next.classList.add("on");
}
const navH=NAV.map(n=>`<a href="#${n}" data-i="n_${n}"></a>`).join("");
$("#links").innerHTML=navH;$("#menu").innerHTML=navH;
$("#mb").addEventListener("click",e=>{e.stopPropagation();const o=$("#menu").classList.toggle("open");$("#mb").setAttribute("aria-expanded",o)});
document.addEventListener("click",e=>{if(!e.target.closest("#menu"))closeMenu()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeMenu()});
addEventListener("hashchange",route);

/* socials (icon buttons, shown once, on the Contact page) */
$("#soc").innerHTML=S.map(s=>`<button type="button" data-u="${s[2]}" aria-label="${s[0]}" title="${s[0]}">${s[1]}</button>`).join("");
$$("#soc button").forEach(b=>b.addEventListener("click",()=>window.open(b.dataset.u,"_blank","noopener,noreferrer")));

/* photo: zoomed in at rest, zooms out on touch or hover */
const av=$("#av");
av.onerror=()=>{av.onerror=null;av.src="data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#e8620c"/><text x="50" y="66" font-size="52" font-family="sans-serif" font-weight="700" fill="#fff" text-anchor="middle">A</text></svg>')};
$("#ph").addEventListener("click",e=>{e.stopPropagation();e.currentTarget.classList.toggle("z")});
document.addEventListener("click",()=>$("#ph").classList.remove("z"));

$$("[data-l]").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.l)));
$("#th").addEventListener("click",()=>setTheme(root.dataset.theme==="dark"?"light":"dark"));
$("#f").addEventListener("submit",async e=>{
  e.preventDefault();const st=$("#st"),t=T[lang];st.textContent=t.sending;
  try{const r=await fetch(FORM,{method:"POST",body:new FormData(e.target),headers:{Accept:"application/json"}});
    if(!r.ok)throw 0;st.textContent=t.ok;e.target.reset()}catch(x){st.textContent=t.err}
});
const car=$("#car");let dn=0,sx=0,s0=0;car.addEventListener("mousedown",e=>{dn=1;sx=e.pageX;s0=car.scrollLeft});addEventListener("mouseup",()=>dn=0);car.addEventListener("mousemove",e=>{if(dn)car.scrollLeft=s0-(e.pageX-sx)});
$("#yr").textContent=new Date().getFullYear();

/* init */
if(load("lang")==="bn")lang="bn";
setTheme(load("theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"));
render();route();setInterval(tick,1000);
</script>
</body>
</html>
