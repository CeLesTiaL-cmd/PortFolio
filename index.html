$("#edu").addEventListener("pointermove",e=>{
  if(e.pointerType==="touch")return;const c=e.target.closest(".fc");if(!c)return;
  const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5,l=c.querySelector(".lb");
  $$(".fc .lb").forEach(o=>{if(o!==l){o.style.setProperty("--rx","0deg");o.style.setProperty("--ry","0deg")}});
  l.style.setProperty("--ry",x*34+"deg");l.style.setProperty("--rx",-y*34+"deg");
});
$("#edu").addEventListener("pointerleave",()=>$$(".fc .lb").forEach(l=>{l.style.setProperty("--rx","0deg");l.style.setProperty("--ry","0deg")}));
/* story: school and university names with logos that pop up */
const INL={iiuc:{i:0,c:"#0f7b4f"},pgc:{i:1,c:"#1d4ed8"},bgc:{i:2,c:"#d97706"}};
function inl(k){const e=EDU[INL[k].i];return `<span class="inl" tabindex="0" style="--c:${INL[k].c}">${e.logo?`<img class="mi" src="${e.logo}" alt="" onerror="this.remove()">`:""}<b>${e.s[lang]}</b><span class="pop"><span class="pl">${e.logo?`<img src="${e.logo}" alt="" onerror="this.remove()">`:""}<i>${e.m}</i></span><small>${e.y[lang]}</small></span></span>`}
function nudge(el){const r=el.getBoundingClientRect(),cx=r.left+r.width/2;el.querySelector(".pop").style.setProperty("--s",(Math.max(8-(cx-75),0)+Math.min(innerWidth-8-(cx+75),0))+"px")}
$("#story").addEventListener("pointerover",e=>{const i=e.target.closest(".inl");if(i)nudge(i)});
$("#story").addEventListener("focusin",e=>{const i=e.target.closest(".inl");if(i)nudge(i)});
$("#story").addEventListener("click",e=>{const i=e.target.closest(".inl");$$(".inl.on").forEach(o=>{if(o!==i)o.classList.remove("on")});if(i){nudge(i);i.classList.toggle("on")}});
document.addEventListener("click",e=>{if(!e.target.closest(".inl"))$$(".inl.on").forEach(o=>o.classList.remove("on"))});
/* touch devices: play the slide-open animation on the social buttons */
function wave(){
  if(!matchMedia("(hover:none)").matches)return;
  $$(".sb").forEach((a,i)=>setTimeout(()=>{a.classList.add("open");setTimeout(()=>a.classList.remove("open"),900)},300+i*450));
}
$("#sb").addEventListener("touchstart",e=>{const a=e.target.closest(".sb");if(a)a.classList.add("open")},{passive:true});
$("#sb").addEventListener("touchend",()=>setTimeout(()=>$$(".sb").forEach(a=>a.classList.remove("open")),500));
addEventListener("scroll",()=>{const h=document.documentElement.scrollHeight-innerHeight;$("#pgb").style.width=(h>0?scrollY/h*100:0)+"%"},{passive:true});
/* pages: one view per hash, e.g. #about */
function closeMenu(){$("#mb").classList.remove("x");$("#menu").classList.remove("open");$("#mb").setAttribute("aria-expanded","false")}
function route(){
  let n=location.hash.slice(1);if(n==="journey")n="about";const pr=P.find(p=>"p-"+p.s===n);
  if(pr){renderProject(pr);n="project"}else if(!NAV.includes(n))n="home";
  const next=$("#v-"+n),now=$(".view.on"),act=n==="project"?"projects":n;
  $$("#links a,#menu a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+act));
  closeMenu();
  if(now===next){if(n==="project")scrollTo(0,0);return}
  if(now){now.classList.add("leave");setTimeout(()=>{$$(".view").forEach(v=>v.classList.remove("on","leave"));next.classList.add("on");place();scrollTo(0,0)},180)}
  else{next.classList.add("on");place()}
  if(n==="home")setTimeout(wave,700);
}
const navH=NAV.map(n=>`<a href="#${n}" data-i="n_${n}"></a>`).join("");
$("#links").innerHTML=navH;$("#menu").innerHTML=navH;
$("#mb").addEventListener("click",e=>{e.stopPropagation();const o=$("#menu").classList.toggle("open");$("#mb").classList.toggle("x",o);$("#mb").setAttribute("aria-expanded",o)});
document.addEventListener("click",e=>{if(!e.target.closest("#menu"))closeMenu()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeMenu()});
addEventListener("hashchange",route);

/* socials: icon buttons that slide open on hover (landing page) */
$("#sb").innerHTML=S.map(s=>`<a class="sb" style="--c:${IC[s[1]].d?"var(--text)":"#"+IC[s[1]].c};--t:${IC[s[1]].d?"var(--bg)":"#fff"}" href="${s[2]}" target="_blank" rel="noopener noreferrer" aria-label="${s[0]}">${ico(s[1])}<span>${s[0]}</span></a>`).join("");

/* photo: zoomed in at rest, zooms out on touch or hover */
const av=$("#av");
av.onerror=()=>{av.onerror=null;av.src="data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#e8620c"/><text x="50" y="66" font-size="52" font-family="sans-serif" font-weight="700" fill="#fff" text-anchor="middle">A</text></svg>')};
$("#ph").addEventListener("click",e=>{e.stopPropagation();e.currentTarget.classList.toggle("z")});
$("#ph").addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();$("#ph").classList.toggle("z")}});
document.addEventListener("click",()=>$("#ph").classList.remove("z"));

$$("[data-l]").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.l)));
$("#th").addEventListener("click",()=>setTheme(root.dataset.theme==="dark"?"light":"dark"));
$("#f").addEventListener("submit",async e=>{
  e.preventDefault();const st=$("#st"),t=T[lang];st.textContent=t.sending;
  try{const r=await fetch(FORM,{method:"POST",body:new FormData(e.target),headers:{Accept:"application/json"}});
    if(!r.ok)throw 0;st.textContent=t.ok;e.target.reset()}catch(x){st.textContent=t.err}
});
$("#yr").textContent=new Date().getFullYear();

/* init */
if(load("lang")==="bn")lang="bn";
setTheme(load("theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"));
render();route();setInterval(tick,1000);
</script>
</body>
</html>
