<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anik Biswas</title>
<meta name="theme-color" content="#fbfbfa"><meta property="og:title" content="Anik Biswas"><meta property="og:description" content="Full-stack developer and competitive programmer from Chattogram."><meta name="description" content="Anik Biswas, full-stack developer and competitive programmer from Chattogram.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbfbfa;--card:#fff;--text:#151513;--muted:#6d6a63;--line:#e6e3dc;--acc:#e8620c;--accsoft:#fdeee3;--ok:#22c55e;--btn:#151513;--btnt:#fff;--dim:#b9b5ab;
--f:'Inter Tight','Hind Siliguri',system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161512;--card:#201f1b;--text:#f1efe9;--muted:#9c978c;--line:#302e29;--acc:#ff8a3d;--accsoft:#332519;--btn:#f1efe9;--btnt:#161512;--dim:#5f5b52}}
:root[data-theme="dark"]{--bg:#161512;--card:#201f1b;--text:#f1efe9;--muted:#9c978c;--line:#302e29;--acc:#ff8a3d;--accsoft:#332519;--btn:#f1efe9;--btnt:#161512;--dim:#5f5b52}
*{box-sizing:border-box}
html{scroll-behavior:smooth;height:auto}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f);font-size:16px;line-height:1.6;transition:background .4s,color .4s;-webkit-font-smoothing:antialiased}
html[lang=bn] body{line-height:1.8}
a{color:inherit;text-decoration:none}
button{font-family:inherit;color:inherit;cursor:pointer}
.wrap{max-width:980px;margin:0 auto;padding:0 20px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px)}
nav .wrap{display:flex;align-items:center;gap:12px;height:68px;position:relative}
.logo{font-weight:700;font-size:20px;letter-spacing:-.02em;margin-right:auto}.logo i{color:var(--acc);font-style:normal}
.links{display:flex;gap:6px;font-size:14.5px;color:var(--muted)}
.links a{padding:6px 12px;border-radius:99px;transition:color .2s,background .2s}.links a:hover{color:var(--text)}
.links a.on,.menu a.on{color:var(--acc);background:var(--accsoft)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:99px;font-size:13px;font-weight:600;color:var(--muted);transition:background .25s,color .25s}
.seg button.on{background:var(--btn);color:var(--btnt)}
.ic{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;transition:transform .25s,border-color .2s}
.ic:hover{transform:translateY(-2px);border-color:var(--acc)}
.dots{display:none}
@media(max-width:860px){.links{display:none}.dots{display:grid}}
@media(min-width:861px){.menu{display:none}}
main{transition:opacity .2s}.fade main{opacity:0}
.view{display:none;padding:44px 0 20px}
.view.on{display:block}
.view.leave{opacity:0;transform:translateY(8px);transition:opacity .18s,transform .18s}
.view.on>*{animation:vin .6s backwards}
.view.on>*:nth-child(2){animation-delay:.07s}.view.on>*:nth-child(3){animation-delay:.14s}.view.on>*:nth-child(4){animation-delay:.21s}.view.on>*:nth-child(5){animation-delay:.28s}
@keyframes vin{from{opacity:0;transform:translateY(14px)}}
.view>.card{margin-bottom:14px}
#v-home{min-height:calc(100vh - 140px);min-height:calc(100svh - 140px);display:none;flex-direction:column;justify-content:center;padding:20px 0 40px}
#v-home.on{display:flex}
h1{font-size:clamp(34px,6.2vw,60px);line-height:1.3;letter-spacing:-.025em;margin:0 0 26px;font-weight:700}
html[lang=bn] h1{letter-spacing:0;line-height:1.35}
.dim{color:var(--dim)}.acc{color:var(--acc)}
.kick{color:var(--muted);font-size:15px;font-weight:500;margin:0 0 22px}
.tile{display:inline-grid;place-items:center;width:1.15em;height:1.15em;border-radius:.32em;background:var(--btn);color:var(--btnt);vertical-align:-.2em;box-shadow:0 14px 28px -12px rgba(0,0,0,.55)}
.tile svg{width:.58em;height:.58em}
.work{display:flex;flex-wrap:wrap;align-items:center;gap:14px 34px;margin:6px 0 34px;color:var(--muted);font-size:15px;font-weight:500}
.work>span{display:inline-flex;align-items:center;gap:10px}
.mini{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;background:color-mix(in srgb,var(--text) 8%,transparent);color:var(--text)}
.mini svg{width:18px;height:18px}
.intro{max-width:620px}.intro p{margin:0 0 18px;font-size:17px;line-height:1.75}.intro p+p{font-size:15.5px;color:var(--muted)}
.intro em{font-style:italic}.num{color:var(--acc);font-variant-numeric:tabular-nums}
.ph{display:inline-block;width:1.15em;height:1.15em;border-radius:.3em;overflow:hidden;vertical-align:-.2em;border:3px solid #f4a261;box-shadow:0 10px 26px -10px rgba(0,0,0,.4);cursor:pointer;position:relative;z-index:1;transform-origin:25% 40%;transition:transform .6s cubic-bezier(.2,.8,.2,1),box-shadow .6s;-webkit-tap-highlight-color:transparent}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.z{transform:scale(4.6) rotate(-6deg);z-index:30;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
@media(hover:hover){.ph:hover{transform:scale(4.6) rotate(-6deg);z-index:30;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}}
@media(max-width:600px){.ph.z{transform:scale(3.3) rotate(-6deg)}}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--btn);color:var(--btnt);border:0;border-radius:99px;padding:13px 26px;font-size:15px;font-weight:600;transition:transform .25s,box-shadow .25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 28px -12px rgba(0,0,0,.45)}
.btn.s{padding:9px 18px;font-size:13.5px;background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn.s:hover{border-color:var(--acc)}
.open{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 14px;font-size:13px}
.open b{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pu 2s infinite}
@keyframes pu{0%{box-shadow:0 0 0 0 var(--ok)}70%,100%{box-shadow:0 0 0 8px transparent}}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;transition:transform .35s,border-color .25s,background .4s}
.card:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--acc) 50%,var(--line))}
.tag{display:inline-block;font-size:11.5px;font-weight:600;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:3px 11px;color:var(--muted);letter-spacing:.02em}
.card h3{margin:10px 0 6px;font-size:19px;letter-spacing:-.01em}
.card p{margin:0;color:var(--muted);font-size:14.5px}
h2{font-size:clamp(28px,5vw,40px);letter-spacing:-.02em;margin:0 0 6px;font-weight:600}
.sub{color:var(--muted);margin:0 0 22px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.chips span{font-size:13px;border:1px solid var(--line);border-radius:99px;padding:5px 13px;background:var(--bg);transition:border-color .2s,transform .2s}
.chips span:hover{border-color:var(--acc);transform:translateY(-1px)}
.fl{display:grid;grid-template-columns:max-content 1fr;gap:10px 24px;margin:18px 0 0;font-size:14.5px}
.fl dt{color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;padding-top:2px}.fl dd{margin:0}
.sg{margin-top:14px}.sg small{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.sg .chips{margin-top:6px}
.cw{list-style:none;margin:12px 0 0;padding:0}.cw li{padding:14px 0;border-top:1px solid var(--line);font-size:14.5px;color:var(--muted)}.cw li:first-child{border:0}.cw b{color:var(--text)}.cw code{font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 7px}.cw .btn{margin-top:8px}
.cd4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.cd4>div{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:14px 6px;text-align:center}
.cd4 b{display:block;font-size:clamp(24px,6vw,40px);font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.cd4 small{color:var(--muted);font-size:12px}
.card p+p{margin-top:4px}
.tl{list-style:none;margin:12px 0 0;padding:0 0 0 16px;border-left:2px solid var(--line)}
.tl>li{position:relative;margin-bottom:18px;font-size:14.5px}
.tl>li::before{content:'';position:absolute;left:-23px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--acc)}
.tl small{display:block;color:var(--muted);font-size:12px}
.tl ul{margin:6px 0 0;padding-left:16px;color:var(--muted)}.tl ul li{margin:0 0 3px;font-size:13.5px}
form{display:grid;gap:12px;max-width:500px;margin-bottom:22px}
input,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 16px;font:inherit;color:var(--text);transition:border-color .2s}
input:focus,textarea:focus{outline:none;border-color:var(--acc)}
#st{font-size:13.5px;min-height:20px;margin:0}
footer{padding:30px 0 60px;color:var(--muted);font-size:13px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.g1{color:var(--muted)}
.hb{position:relative;width:18px;height:14px;display:block}.hb i{position:absolute;left:0;width:100%;height:2px;border-radius:2px;background:currentColor;transition:transform .3s,opacity .2s,top .3s}
.hb i:nth-child(1){top:0}.hb i:nth-child(2){top:6px}.hb i:nth-child(3){top:12px}
#mb.x .hb i:nth-child(1){top:6px;transform:rotate(45deg)}#mb.x .hb i:nth-child(2){opacity:0}#mb.x .hb i:nth-child(3){top:6px;transform:rotate(-45deg)}
.sb-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.sb{display:inline-flex;align-items:center;height:46px;padding:0 13px;border-radius:14px;background:color-mix(in srgb,var(--text) 7%,transparent);color:var(--text);overflow:hidden;transition:background .3s,color .3s,transform .3s}
.sb svg{width:20px;height:20px;fill:currentColor;flex:none}
.sb span{max-width:0;opacity:0;overflow:hidden;white-space:nowrap;font-size:14px;font-weight:600;transition:max-width .45s cubic-bezier(.2,.8,.2,1),opacity .3s,margin .45s}
.sb:hover,.sb:focus-visible{background:var(--accsoft);color:var(--acc)}
@media(hover:hover){.sb:hover span,.sb:focus-visible span{max-width:110px;opacity:1;margin-left:9px}}
.sg{margin-top:18px}#skills{padding-bottom:40px}
.logos{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.lg{position:relative;width:54px;height:54px;border-radius:16px;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;transition:transform .3s,border-color .2s,box-shadow .3s}
.lg svg{width:26px;height:26px}
.lg:hover,.lg:focus-visible{transform:translateY(-4px) scale(1.06);border-color:var(--acc);box-shadow:0 14px 26px -14px rgba(0,0,0,.4)}
.lg::after{content:attr(data-n);position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%) translateY(4px);background:var(--btn);color:var(--btnt);font-size:12px;padding:3px 9px;border-radius:8px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:3}
.lg:hover::after,.lg:focus-visible::after{opacity:1;transform:translateX(-50%)}
.thumb{position:relative;aspect-ratio:16/10;background:var(--accsoft);display:grid;place-items:center;font-size:44px;font-weight:700;color:var(--acc);overflow:hidden}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s}
.flow{position:relative;margin:6px 0 4px}
.stage{position:relative;height:440px;perspective:1300px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.pj{position:absolute;left:50%;top:6px;width:min(330px,76vw);margin-left:calc(min(330px,76vw)/-2);height:420px;background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden;cursor:pointer;transition:transform .7s cubic-bezier(.2,.8,.2,1),opacity .5s,filter .5s,box-shadow .5s,border-color .3s;will-change:transform}
.pj.act{cursor:default;border-color:var(--acc);box-shadow:0 30px 60px -28px rgba(0,0,0,.5)}
.pj.act:hover .thumb img{transform:scale(1.06)}
.go{position:absolute;top:12px;right:12px;width:42px;height:42px;border-radius:50%;border:0;background:var(--btn);color:var(--btnt);display:grid;place-items:center;transition:transform .3s,background .3s;z-index:2}
.go svg{width:20px;height:20px}.go:hover,.go:focus-visible{transform:rotate(45deg) scale(1.08);background:var(--acc);color:#fff}
.pb{padding:16px 20px}.pb h3{margin:10px 0 6px;font-size:20px;letter-spacing:-.01em}
.pb p{margin:0;color:var(--muted);font-size:14.5px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.stat{display:inline-block;font-size:11.5px;font-weight:600;border:1px solid #16a34a;color:#16a34a;border-radius:99px;padding:2px 10px}.stat.o{border-color:var(--acc);color:var(--acc)}
.nv{position:absolute;top:42%;z-index:20;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;transition:transform .25s,border-color .2s;box-shadow:0 10px 24px -12px rgba(0,0,0,.4)}
.nv:hover{border-color:var(--acc);transform:scale(1.08)}.nv svg{width:20px;height:20px}.prev{left:0}.next{right:0}
.dots2{display:flex;justify-content:center;gap:8px;margin:2px 0 26px}
.dots2 button{width:8px;height:8px;border-radius:99px;border:0;background:var(--line);padding:0;transition:width .4s,background .3s}.dots2 button.on{width:26px;background:var(--acc)}
@media(max-width:600px){.nv{width:36px;height:36px;top:44%}.stage{height:430px}}
#v-project.on{animation:pshift .6s cubic-bezier(.2,.8,.2,1)}
@keyframes pshift{from{opacity:0;transform:translateX(60px)}}
.back{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;margin-bottom:18px;transition:color .2s,transform .3s}
.back:hover{color:var(--acc);transform:translateX(-3px)}.back svg{width:18px;height:18px}
.ban{border-radius:24px;overflow:hidden;border:1px solid var(--line);margin-bottom:22px}.ban .thumb{aspect-ratio:16/7;font-size:72px}
.ph2 h2{margin:10px 0 6px}
.doc{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px;margin:18px 0}
.doc h3{margin:24px 0 8px;font-size:17px}.doc h3:first-child{margin-top:0}
.doc p{margin:0;color:var(--muted);font-size:15.5px;line-height:1.75}.doc ul{margin:0;padding-left:20px;color:var(--muted);font-size:15px;line-height:1.8}
.btn.gr{background:#16a34a;color:#fff}.btn.gr:hover{box-shadow:0 12px 28px -12px rgba(22,163,74,.7)}.btn.off{opacity:.55;pointer-events:none}
.acts{margin:6px 0 30px}
#pgb{position:fixed;top:0;left:0;height:3px;width:0;background:var(--acc);z-index:50}
main{overflow-x:clip}.flow{overflow-x:clip}.stage{overscroll-behavior-x:contain}
.menu{position:absolute;left:0;right:0;top:100%;background:var(--bg);border-bottom:1px solid var(--line);padding:4px 20px 14px;display:flex;flex-direction:column;opacity:0;transform:translateY(-10px);pointer-events:none;visibility:hidden;transition:opacity .25s,transform .25s,visibility .25s;box-shadow:0 26px 40px -28px rgba(0,0,0,.5)}
.menu.open{opacity:1;transform:none;pointer-events:auto;visibility:visible}
.menu a{padding:15px 2px;border-bottom:1px solid var(--line);font-size:17px;font-weight:500;border-radius:0}
.menu a:last-child{border-bottom:0}
.menu a:hover{color:var(--acc)}
.links a.on,.menu a.on{color:var(--acc)}.menu a.on{background:none}
.tile{box-shadow:0 18px 32px -10px rgba(0,0,0,.6),0 0 0 1px color-mix(in srgb,var(--text) 10%,transparent);transition:transform .45s cubic-bezier(.2,.8,.2,1);cursor:pointer;animation:bob 4.5s ease-in-out infinite}
.tile.t2{animation-delay:-2.2s}
.tile:hover,.tile:active{transform:rotate(-8deg) scale(1.14)}
.tile svg{transition:transform .5s}.tile:hover svg,.tile:active svg{transform:rotate(12deg) scale(1.12)}
:root[data-theme=dark] .tile{box-shadow:0 18px 32px -10px rgba(0,0,0,.95),0 0 0 1px rgba(255,255,255,.14)}
@keyframes bob{50%{translate:0 -6px;rotate:-5deg}}
.ph{box-shadow:0 18px 34px -10px rgba(0,0,0,.5),0 10px 28px -10px rgba(244,162,97,.7)}
.ph:not(.z){animation:bob2 5.5s ease-in-out infinite}
@keyframes bob2{50%{translate:0 -4px}}
@media(hover:hover){.ph:hover{animation:none}}
.sb.open{background:var(--accsoft);color:var(--acc)}
.sb.open span{max-width:110px;opacity:1;margin-left:9px}
.lg.new::before{content:"";position:absolute;top:-4px;right:-4px;width:10px;height:10px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 3px var(--card)}
.pn{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:30px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div id="pgb"></div>
<nav><div class="wrap">
  <a href="#home" class="logo">Anik<i>.</i></a>
  <div class="links" id="links"></div>
  <div class="seg" role="group" aria-label="Language"><button data-l="bn">বাংলা</button><button data-l="en" class="on">EN</button></div>
  <button class="ic" id="th" aria-label="Toggle theme"></button>
  <button class="ic dots" id="mb" aria-label="Menu" aria-expanded="false"><span class="hb"><i></i><i></i><i></i></span></button>
  </div>
<div class="menu" id="menu"></div></nav>

<main class="wrap">
<section class="view on" id="v-home">
  <p class="kick" data-i="k1"></p>

  <span class="g1" data-i="h2"></span> <span class="tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m10 10-2 2 2 2M14 10l2 2-2 2"/></svg></span> <span data-i="h3"></span> <span class="tile t2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg></span> <span data-i="h4"></span></h1>
  <div class="work">
    <span><span data-i="r1"></span><span class="mini"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 17 6-6-6-6M12 19h8"/></svg></span></span>
    <span><span data-i="r2"></span><span class="mini"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 4v4M9 13v1M15 13v1"/></svg></span><span class="mini"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg></span><span class="mini"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/></svg></span></span>
  </div>
  <div class="intro"><p data-h="p1"></p><p data-h="p2"></p><p data-h="p3"></p></div>
  <div class="sb-row" id="sb"></div>
</section>

}
function setTheme(m){root.dataset.theme=m;$("#th").innerHTML=m==="dark"?SUN:MOON;store("theme",m)}

/* project showcase (coverflow) and detail page */
let didDrag=false;
function buildFlow(){
  const t=T[lang];
  $("#stage").innerHTML=P.map((p,i)=>`<article class="pj" data-k="${i}">${th(p)}<button class="go" aria-label="${t.open_p}: ${p.n}" data-go="${p.s}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg></button><div class="pb"><span class="stat ${p.ong?"o":""}">${p.ong?t.ong:t.live_s}</span><h3>${p.n}</h3><p>${p.d[lang]}</p></div></article>`).join("");
  $("#dots2").innerHTML=P.map((p,i)=>`<button aria-label="${p.n}" data-d="${i}"></button>`).join("");
  place();
}
function place(){
  const cs=$$(".pj");if(!cs.length)return;
  const w=cs[0].offsetWidth||330,step=innerWidth<700?w*.55:w*.74;
  cs.forEach((c,i)=>{const o=i-cur,a=Math.abs(o);
    c.style.transform=`translateX(${o*step}px) scale(${1-Math.min(a,3)*.12}) rotateY(${o*-14}deg)`;
    c.style.zIndex=10-a;c.style.opacity=a>2?0:1-a*.28;c.style.filter=a?`blur(${a*1.2}px)`:"none";c.style.pointerEvents=a>2?"none":"auto";
    c.classList.toggle("act",!a)});
  $$("#dots2 button").forEach((b,i)=>b.classList.toggle("on",i===cur));
}
function setCur(i){cur=Math.max(0,Math.min(P.length-1,i));place()}
function renderProject(p){
  const t=T[lang];
  $("#v-project").innerHTML=`<a href="#projects" class="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>${t.back}</a>
  <div class="ban">${th(p)}</div>
  <div class="ph2"><span class="stat ${p.ong?"o":""}">${p.ong?t.ong:t.live_s}</span><h2>${p.n}</h2><p class="sub">${p.d[lang]}</p></div>
  <div class="doc"><h3>${t.ov}</h3><p>${p.l[lang]}</p><h3>${t.hi}</h3><ul>${p.h[lang].map(x=>`<li>${x}</li>`).join("")}</ul><h3>${t.tech}</h3><div class="chips">${p.t.map(x=>`<span>${x}</span>`).join("")}</div></div>
  <div class="row acts">${p.u?`<a class="btn gr" href="${p.u}" target="_blank" rel="noopener noreferrer">${t.demo}</a>`:`<span class="btn gr off">${t.soon}</span>`}${p.g?`<a class="btn s" href="${p.g}" target="_blank" rel="noopener noreferrer">${t.repo}</a>`:""}</div>
  <div class="pn">${[-1,1].map(d=>{const q=P[(P.indexOf(p)+d+P.length)%P.length];return `<a class="btn s" href="#p-${q.s}">${d<0?"&larr; ":""}${q.n}${d>0?" &rarr;":""}</a>`}).join("")}</div>`;
}
$("#stage").addEventListener("click",e=>{
  const g=e.target.closest(".go");if(g){location.hash="p-"+g.dataset.go;return}
  const c=e.target.closest(".pj");if(c&&!didDrag)setCur(+c.dataset.k);
});
let px=0;
$("#stage").addEventListener("pointerdown",e=>{px=e.clientX;didDrag=false});
$("#stage").addEventListener("pointerup",e=>{const d=e.clientX-px;if(Math.abs(d)>50){didDrag=true;setCur(cur+(d<0?1:-1))}else didDrag=Math.abs(d)>8;setTimeout(()=>didDrag=false,50)});
$("#pv").addEventListener("click",()=>setCur(cur-1));
$("#nx").addEventListener("click",()=>setCur(cur+1));
$("#dots2").addEventListener("click",e=>{const b=e.target.closest("button");if(b)setCur(+b.dataset.d)});
addEventListener("resize",place);
document.addEventListener("keydown",e=>{if($("#v-projects").classList.contains("on")){if(e.key==="ArrowLeft")setCur(cur-1);if(e.key==="ArrowRight")setCur(cur+1)}});

/* touch devices: play the slide-open animation on the social buttons */
function wave(){
  if(!matchMedia("(hover:none)").matches)return;
  $$(".sb").forEach((a,i)=>setTimeout(()=>{a.classList.add("open");setTimeout(()=>a.classList.remove("open"),900)},300+i*450));
}
$("#sb").addEventListener("touchstart",e=>{const a=e.target.closest(".sb");if(a)a.classList.add("open")},{passive:true});
$("#sb").addEventListener("touchend",()=>setTimeout(()=>$$(".sb").forEach(a=>a.classList.remove("open")),500));
addEventListener("scroll",()=>{const h=document.documentElement.scrollHeight-innerHeight;$("#pgb").style.width=(h>0?scrollY/h*100:0)+"%"},{passive:true});
/* pages: one view per hash, e.g. #about */
function closeMenu(){$("#mb").classList.remove("x");$("#menu").classList.remove("open");$("#mb").setAttribute("aria-expanded","false")}
function route(){
  let n=location.hash.slice(1);const pr=P.find(p=>"p-"+p.s===n);
  if(pr){renderProject(pr);n="project"}else if(!NAV.includes(n))n="home";
  const next=$("#v-"+n),now=$(".view.on"),act=n==="project"?"projects":n;
  $$("#links a,#menu a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+act));
  closeMenu();
  if(now===next){if(n==="project")scrollTo(0,0);return}
  if(now){now.classList.add("leave");setTimeout(()=>{$$(".view").forEach(v=>v.classList.remove("on","leave"));next.classList.add("on");place();scrollTo(0,0)},180)}
  else{next.classList.add("on");place()}
  if(n==="home")setTimeout(wave,700);
}
const navH=NAV.map(n=>`<a href="#${n}" data-i="n_${n}"></a>`).join("");
$("#links").innerHTML=navH;$("#menu").innerHTML=navH;
$("#mb").addEventListener("click",e=>{e.stopPropagation();const o=$("#menu").classList.toggle("open");$("#mb").classList.toggle("x",o);$("#mb").setAttribute("aria-expanded",o)});
document.addEventListener("click",e=>{if(!e.target.closest("#menu"))closeMenu()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeMenu()});
addEventListener("hashchange",route);

/* socials: icon buttons that slide open on hover (landing page) */
$("#sb").innerHTML=S.map(s=>`<a class="sb" href="${s[2]}" target="_blank" rel="noopener noreferrer" aria-label="${s[0]}">${ico(s[1])}<span>${s[0]}</span></a>`).join("");

/* photo: zoomed in at rest, zooms out on touch or hover */
const av=$("#av");
av.onerror=()=>{av.onerror=null;av.src="data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#e8620c"/><text x="50" y="66" font-size="52" font-family="sans-serif" font-weight="700" fill="#fff" text-anchor="middle">A</text></svg>')};
$("#ph").addEventListener("click",e=>{e.stopPropagation();e.currentTarget.classList.toggle("z")});
$("#ph").addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();$("#ph").classList.toggle("z")}});
document.addEventListener("click",()=>$("#ph").classList.remove("z"));

$$("[data-l]").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.l)));
$("#th").addEventListener("click",()=>setTheme(root.dataset.theme==="dark"?"light":"dark"));
$("#f").addEventListener("submit",async e=>{
  e.preventDefault();const st=$("#st"),t=T[lang];st.textContent=t.sending;
  try{const r=await fetch(FORM,{method:"POST",body:new FormData(e.target),headers:{Accept:"application/json"}});
    if(!r.ok)throw 0;st.textContent=t.ok;e.target.reset()}catch(x){st.textContent=t.err}
});
$("#yr").textContent=new Date().getFullYear();

/* init */
if(load("lang")==="bn")lang="bn";
setTheme(load("theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"));
render();route();setInterval(tick,1000);
</script>
</body>
</html>
