<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Anik Biswas — Full-Stack Developer</title>
<meta name="description" content="Portfolio of Anik Biswas — CSE student at IIUC, full-stack developer working with the MERN stack, and competitive programmer." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#0d0f12;
  --text:#e6e8eb;
  --muted:#868c99;
  --border:#24262b;
  --accent:#e8a33d;
  --accent2:#5fd4d0;
  --code-bg:#16181c;
  --maxw:680px;
  --mono:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}

*{ box-sizing:border-box; }
html{ scroll-behavior:smooth; }
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--mono); font-size:15px; line-height:1.75;
  -webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion: reduce){
  html{ scroll-behavior:auto; }
  *{ transition:none !important; }
  .reveal{ opacity:1 !important; transform:none !important; }
  #hero .avatar, #hero h1, #hero .role, #hero .desc, #hero .hero-links{ opacity:1 !important; transform:none !important; }
}
a{ color:var(--accent); text-decoration:none; }
a:hover{ text-decoration:underline; }
:focus-visible{ outline:1px solid var(--accent); outline-offset:2px; }

.page{ max-width:var(--maxw); margin:0 auto; padding:0 20px; }

/* Header + logo */
.site-header{
  position:sticky; top:0; background:var(--bg); border-bottom:1px solid var(--border);
  display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;
  gap:10px 16px; padding:16px 0; z-index:10;
}
.site-nav{ display:flex; gap:14px; flex-wrap:wrap; font-size:13.5px; order:1; }
.site-nav a{ color:var(--muted); }
.site-nav a:hover{ color:var(--text); text-decoration:none; }
.site-nav a.active{ color:var(--accent); }
.logo{ display:flex; align-items:center; font-weight:700; color:var(--text); order:2; }
.logo:hover{ text-decoration:none; }
.logo-mark{
  background:var(--accent); color:#1a1400; width:22px; height:22px; display:inline-flex;
  align-items:center; justify-content:center; border-radius:5px; font-size:13px; margin-right:5px;
}

/* Scroll reveal */
.reveal{ opacity:0; transform:translateY(16px); transition:opacity .5s ease, transform .5s ease; }
.reveal.show{ opacity:1; transform:none; }

/* Hero: children reveal in sequence rather than all at once */
#hero.reveal{ opacity:1; transform:none; }
#hero .avatar, #hero h1, #hero .role, #hero .desc, #hero .hero-links{
  opacity:0; transform:translateY(14px); transition:opacity .45s ease, transform .45s ease;
}
#hero.show .avatar{ opacity:1; transform:none; transition-delay:.05s; }
#hero.show h1{ opacity:1; transform:none; transition-delay:.15s; }
#hero.show .role{ opacity:1; transform:none; transition-delay:.25s; }
#hero.show .desc{ opacity:1; transform:none; transition-delay:.35s; }
#hero.show .hero-links{ opacity:1; transform:none; transition-delay:.45s; }

main{ padding-top:10px; }
.block{ padding:52px 0; border-bottom:1px solid var(--border); }
.block:last-of-type{ border-bottom:none; }

.avatar{ width:64px; height:64px; border-radius:50%; object-fit:cover; border:2px solid var(--border); margin-bottom:18px; display:block; }
h1{ font-size:26px; margin:0 0 10px; }
h2{ font-size:15px; color:var(--accent); margin:0 0 24px; font-weight:600; }
.role{ color:var(--muted); margin:0 0 16px; }
.desc{ max-width:60ch; margin:0 0 20px; }
.hero-links{ margin:0; }

.fact-list{ display:grid; grid-template-columns:max-content 1fr; gap:8px 24px; margin-top:22px; font-size:14px; }
.fact-list dt{ color:var(--muted); }
.fact-list dd{ margin:0; }

code{
  background:var(--code-bg); border:1px solid var(--border); border-radius:3px;
  padding:2px 6px; font-size:12.5px; font-family:var(--mono); color:var(--text);
}

.skill-row{ display:flex; gap:14px; margin-bottom:12px; flex-wrap:wrap; }
.skill-row .label{ color:var(--muted); min-width:170px; font-size:13.5px; }
.skill-row .items{ display:flex; flex-wrap:wrap; gap:6px; }

/* Swipeable project carousel */
.section-hint{ color:var(--muted); font-size:13px; margin:-16px 0 22px; }
.project-carousel{
  display:flex; gap:14px; overflow-x:auto; scroll-snap-type:x mandatory;
  padding-bottom:14px; margin-bottom:6px; -webkit-overflow-scrolling:touch;
  cursor:grab; scrollbar-width:thin; scrollbar-color:var(--border) transparent;
}
.project-carousel:active{ cursor:grabbing; }
.project-carousel::-webkit-scrollbar{ height:5px; }
.project-carousel::-webkit-scrollbar-thumb{ background:var(--border); border-radius:3px; }
.project-card{
  flex:0 0 220px; scroll-snap-align:start; background:var(--code-bg); border:1px solid var(--border);
  border-radius:5px; overflow:hidden; cursor:pointer; transition:border-color .15s ease, transform .15s ease;
}
.project-card:hover{ border-color:var(--accent); }
.project-card.active{ border-color:var(--accent-2); }
.project-card .card-body{ padding:16px; }
.project-card .pname{ font-weight:700; display:block; margin-bottom:6px; color:var(--text); }
.project-card .pname .flag{ color:var(--accent); font-size:11px; font-weight:400; margin-left:6px; }
.project-card p{ color:var(--muted); font-size:13px; margin:0 0 10px; }
.project-card .tag-row{ margin-bottom:0; }

.thumb{
  aspect-ratio:16/10; overflow:hidden; background:var(--code-bg); border-bottom:1px solid var(--border);
}
.thumb img{ width:100%; height:100%; object-fit:cover; display:block; transition:transform .35s ease; }
.project-card:hover .thumb img{ transform:scale(1.08); }
.thumb-placeholder{ display:flex; align-items:center; justify-content:center; }
.thumb-placeholder span{ font-size:32px; font-weight:700; color:var(--accent); }
.detail-thumb{ border-radius:5px 5px 0 0; aspect-ratio:16/8; margin:-24px -24px 20px; width:calc(100% + 48px); }
.detail-thumb.thumb-placeholder{ background:var(--code-bg); }

.project-detail-panel{
  border:1px solid var(--border); border-radius:5px; padding:24px; background:var(--bg);
  overflow:hidden; opacity:0; transform:translateY(6px); transition:opacity .2s ease, transform .2s ease;
}
.project-detail-panel.show{ opacity:1; transform:none; }
.project-detail-panel h3{ margin:0 0 4px; font-size:17px; }
.project-detail-panel .flag{ color:var(--accent); font-size:11px; margin-left:8px; }
.project-detail-panel p.detail-text{ font-size:14px; margin:10px 0 14px; color:var(--text); }
.project-detail-panel ul{ margin:0 0 14px; padding-left:20px; }
.project-detail-panel li{ font-size:13.5px; margin-bottom:6px; color:var(--muted); }
.tag-row{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
.plink{ margin-right:16px; font-size:13.5px; }

.coursework{ margin-top:30px; }
.coursework .label{ color:var(--muted); font-size:13px; margin:0 0 12px; }
.coursework ul{ list-style:none; margin:0; padding:0; }
.coursework li{ font-size:14px; margin-bottom:10px; color:var(--muted); }
.coursework li strong{ color:var(--text); }

.changelog-entry{ margin-bottom:26px; }
.changelog-entry:last-child{ margin-bottom:0; }
.changelog-date{ color:var(--accent); font-size:13.5px; font-weight:600; margin-bottom:6px; }
.changelog-entry ul{ margin:0; padding-left:20px; }
.changelog-entry li{ font-size:14px; margin-bottom:4px; }

.plain-list{ list-style:none; margin:0; padding:0; }
.plain-list li{ margin-bottom:8px; font-size:14px; }
.plain-list .handle{ color:var(--muted); }

.contact-form{ display:flex; flex-direction:column; gap:4px; max-width:440px; }
.contact-form label{ color:var(--muted); font-size:13px; margin-top:14px; }
.contact-form input, .contact-form textarea{
  background:var(--code-bg); border:1px solid var(--border); color:var(--text);
  font-family:var(--mono); font-size:14px; padding:9px 11px; border-radius:3px;
}
.contact-form input:focus, .contact-form textarea:focus{ border-color:var(--accent); outline:none; }
.contact-form button{
  margin-top:18px; align-self:flex-start; background:transparent; border:1px solid var(--accent);
  color:var(--accent); font-family:var(--mono); font-size:14px; padding:9px 22px; border-radius:3px; cursor:pointer;
}
.contact-form button:hover{ background:var(--accent); color:#1a1400; }
.form-status{ font-size:13px; margin-top:10px; min-height:16px; }
.form-status.ok{ color:#57c785; }
.form-status.err{ color:#e2685a; }

.site-footer{ display:flex; gap:20px; color:var(--muted); font-size:12px; padding:24px 0 60px; }

</style>
</head>

/* ------------------------------------------------------------

const FORMSPREE_ENDPOINT = "https://formspree.io/f/YOUR_FORM_ID";

/* ============================================================
   Rendering
   ============================================================ */

function renderHero() {
  document.getElementById("heroName").textContent = DATA.name;
  document.getElementById("heroRole").textContent = DATA.role;
  document.getElementById("heroDesc").textContent = DATA.heroDesc;
}

function renderAbout() {

  document.getElementById("factList").innerHTML = DATA.about.facts
    .map((f) => `<dt>${f.label}</dt><dd>${f.value}</dd>`)

function renderSkills() {
  document.getElementById("skillRows").innerHTML = Object.entries(DATA.skills)
    .map(
      ([label, items]) => `
      <div class="skill-row">
        <span class="label">${label}</span>

      </div>`
    )

/* ------------------------------------------------------------
   Projects: swipeable carousel + shared detail panel
   ------------------------------------------------------------ */

function thumbHTML(p, extraClass) {
  if (p.image) {
    return `<div class="thumb ${extraClass || ""}"><img src="${p.image}" alt="${p.name} screenshot" loading="lazy" onerror="this.parentElement.classList.add('thumb-placeholder');this.remove();" /></div>`;
  }
  return `<div class="thumb thumb-placeholder ${extraClass || ""}"><span>${p.name.charAt(0)}</span></div>`;
}

function renderProjects() {
  const carousel = document.getElementById("projectCarousel");
  const panel = document.getElementById("projectDetailPanel");

  carousel.innerHTML = DATA.projects
    .map(
      (p, i) => `
      <div class="project-card" data-index="${i}">
        ${thumbHTML(p)}
        <div class="card-body">
          <span class="pname">${p.name}${p.current ? '<span class="flag">current</span>' : ""}</span>
          <p>${p.description}</p>
          <div class="tag-row">${p.tags.slice(0, 3).map((t) => `<code>${t}</code>`).join("")}</div>
        </div>
      </div>`
    )
    .join("");

  const cards = Array.from(carousel.querySelectorAll(".project-card"));
  cards.forEach((card) => {
    card.addEventListener("click", () => {
      cards.forEach((c) => c.classList.remove("active"));
      card.classList.add("active");
      showProjectDetail(DATA.projects[Number(card.dataset.index)]);
    });
  });

  // Show the current/first project by default
  if (cards.length) {
    cards[0].classList.add("active");
    showProjectDetail(DATA.projects[0]);
  }

  // Mouse drag-to-scroll, so desktop users get the same swipe feel as touch
  let isDown = false, startX = 0, startScroll = 0;
  carousel.addEventListener("mousedown", (e) => {
    isDown = true; startX = e.pageX; startScroll = carousel.scrollLeft;
  });
  window.addEventListener("mouseup", () => { isDown = false; });
  carousel.addEventListener("mouseleave", () => { isDown = false; });
  carousel.addEventListener("mousemove", (e) => {
    if (!isDown) return;
    e.preventDefault();
    carousel.scrollLeft = startScroll - (e.pageX - startX);
  });

  document.getElementById("courseworkList").innerHTML = DATA.coursework
    .map((c) => `<li><strong>${c.name}</strong> (${c.tags}) — ${c.note}</li>`)
    .join("");
}

function showProjectDetail(project) {
  const panel = document.getElementById("projectDetailPanel");
  panel.classList.remove("show");
  panel.innerHTML = `
    ${thumbHTML(project, "detail-thumb")}
    <div class="detail-body">
      <h3>${project.name}${project.current ? '<span class="flag">current</span>' : ""}</h3>
      <p class="detail-text">${project.detail}</p>
      <ul>${project.highlights.map((h) => `<li>${h}</li>`).join("")}</ul>
      <div class="tag-row">${project.tags.map((t) => `<code>${t}</code>`).join("")}</div>
      <div class="links">
        ${project.live ? `<a class="plink" href="${project.live}" target="_blank" rel="noopener noreferrer">live demo →</a>` : ""}
        ${project.source ? `<a class="plink" href="${project.source}" target="_blank" rel="noopener noreferrer">source →</a>` : ""}
      </div>
    </div>
  `;
  // restart the transition so switching projects always animates in
  requestAnimationFrame(() => panel.classList.add("show"));
}

function renderChangelog() {
  document.getElementById("changelogList").innerHTML = DATA.changelog
    .map(
      (e) => `
      <div class="changelog-entry">
        <div class="changelog-date">${e.date} — ${e.title}</div>
        <ul>${e.items.map((i) => `<li>${i}</li>`).join("")}</ul>
      </div>`
    )
    .join("");
}

function renderSocial() {
  document.getElementById("connectList").innerHTML = DATA.social
    .map(
      (s) => `<li><a href="${s.url}" target="_blank" rel="noopener noreferrer">${s.platform}</a> <span class="handle">— ${s.handle}</span></li>`

}

function renderFooter() {
  document.getElementById("footerLocation").textContent = DATA.location;
  document.getElementById("footerCopy").textContent = `© ${new Date().getFullYear()} ${DATA.name}`;
  document.getElementById("contactAlt").innerHTML = `prefer email? write to <a href="mailto:${DATA.email}">${DATA.email}</a>`;
}

/* ============================================================
   Nav: simple scroll-spy, no visual chrome beyond a color change
   ============================================================ */

function initNav() {
  const links = Array.from(document.querySelectorAll(".site-nav a"));
  const sections = links.map((a) => document.getElementById(a.dataset.target)).filter(Boolean);

  const observer = new IntersectionObserver(
    (entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          links.forEach((a) => a.classList.toggle("active", a.dataset.target === entry.target.id));
        }
      });
    },
    { rootMargin: "-40% 0px -55% 0px" }
  );
  sections.forEach((s) => observer.observe(s));
}

/* ============================================================
   Scroll reveal — sections fade/slide in once, then stay put
   ============================================================ */

function initReveal() {
  const els = document.querySelectorAll(".reveal");
  const observer = new IntersectionObserver(
    (entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add("show");
          observer.unobserve(entry.target);
        }
      });
    },
    { threshold: 0.12 }
  );
  els.forEach((el) => observer.observe(el));
}

/* ============================================================
   Contact form
   ============================================================ */

function initContactForm() {
  const form = document.getElementById("contactForm");
  const status = document.getElementById("formStatus");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    status.textContent = "sending…";
    status.className = "form-status";

    try {
      const res = await fetch(FORMSPREE_ENDPOINT, {
        method: "POST",
        body: new FormData(form),
        headers: { Accept: "application/json" }
      });
      if (!res.ok) throw new Error("Form endpoint not ready");
      status.textContent = "message sent — thanks, I'll reply soon.";
      status.className = "form-status ok";
      form.reset();
    } catch (err) {
      status.textContent = `couldn't send that yet — please email me directly at ${DATA.email}.`;
      status.className = "form-status err";
    }
  });
}

/* ============================================================
   Init
   ============================================================ */

document.addEventListener("DOMContentLoaded", () => {
  renderHero();
  renderAbout();
  renderSkills();
  renderProjects();
  renderChangelog();
  renderSocial();
  renderFooter();
  initNav();
  initReveal();
  initContactForm();
});

</script>
