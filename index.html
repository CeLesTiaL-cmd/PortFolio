<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Anik Biswas — Full-Stack Developer</title>
<meta name="description" content="Portfolio of Anik Biswas — CSE student at IIUC, full-stack developer working with the MERN stack, and competitive programmer." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#0b0a09;
  --bg-2:#151210;
  --bg-3:#1b1714;
  --text:#f5f1ea;
  --muted:#a79c8e;
  --muted-2:#786e63;
  --border:#2a2420;
  --accent:#e8a33d;
  --accent-2:#ff7a45;
  --accent-soft:rgba(232,163,61,.16);
  --radius:16px;
  --maxw:920px;
  --display:'Space Grotesk', ui-sans-serif, sans-serif;
  --sans:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --mono:'JetBrains Mono', ui-monospace, monospace;
}

*{ box-sizing:border-box; }
html{ scroll-behavior:smooth; }
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--sans); font-size:16px; line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
a{ color:inherit; text-decoration:none; }
:focus-visible{ outline:1px solid var(--accent); outline-offset:3px; }
h1,h2{ font-family:var(--display); letter-spacing:-0.01em; }

@media (prefers-reduced-motion: reduce){
  html{ scroll-behavior:auto; }
  *{ animation:none !important; transition:none !important; }
  .reveal{ opacity:1 !important; transform:none !important; }
}

/* Nav */
.pill-nav{
  position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between;
  gap:20px; padding:22px clamp(20px,5vw,64px); background:linear-gradient(var(--bg) 60%, transparent);
}
.logo{ font-family:var(--display); font-weight:700; font-size:18px; }
.logo .dot{ color:var(--accent); }
.pill-links{ display:flex; gap:28px; font-size:14px; color:var(--muted); }
.pill-links a:hover{ color:var(--text); }
.pill-links a.active{ color:var(--accent); }
.pill-cta{
  font-size:13.5px; font-weight:600; border:1px solid var(--border); padding:10px 20px;
  border-radius:999px; transition:border-color .2s ease, box-shadow .2s ease, transform .2s ease;
}
.pill-cta:hover{ border-color:var(--accent); box-shadow:0 0 24px -6px var(--accent-soft); transform:translateY(-1px); }
@media (max-width:640px){ .pill-links{ display:none; } }

/* Hero */
.hero{ position:relative; min-height:92vh; display:flex; flex-direction:column; justify-content:center; overflow:hidden; padding:0 20px; }
.hero-glow{
  position:absolute; left:50%; top:38%; width:640px; height:640px; transform:translate(-50%,-50%);
  background:radial-gradient(circle, rgba(232,163,61,.32), transparent 65%);
  filter:blur(10px); pointer-events:none; z-index:0;
  transition:left .3s ease, top .3s ease;
}
.hero-bigtext{
  position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  z-index:0; pointer-events:none; user-select:none;
}
.hero-bigtext span{
  font-family:var(--display); font-weight:700; line-height:.86; letter-spacing:-0.02em;
  font-size:clamp(52px,15vw,200px); color:rgba(245,241,234,.05); white-space:nowrap;
}
.hero-inner{ position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; text-align:center; gap:22px; padding-top:40px; }
.hero-photo-wrap{ width:clamp(190px,26vw,260px); }
.hero-photo{
  width:100%; aspect-ratio:3/4; object-fit:cover; border-radius:20px;
  -webkit-mask-image:linear-gradient(to bottom, black 68%, transparent 100%);
  mask-image:linear-gradient(to bottom, black 68%, transparent 100%);
  filter:drop-shadow(0 20px 50px rgba(0,0,0,.5));
}
.hero-tagline{ max-width:38ch; font-size:16.5px; color:var(--muted); margin:0; }
.glow-btn{
  display:inline-block; font-family:var(--sans); font-weight:600; font-size:14.5px;
  background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:#1a1000;
  padding:13px 28px; border-radius:999px; box-shadow:0 0 0 rgba(232,163,61,0);
  transition:transform .2s ease, box-shadow .2s ease;
}
.glow-btn:hover{ transform:translateY(-2px) scale(1.02); box-shadow:0 10px 34px -8px rgba(232,163,61,.55); }

/* Marquee */
.marquee{
  position:relative; z-index:1; margin-top:56px; overflow:hidden;
  border-top:1px solid var(--border); border-bottom:1px solid var(--border);
  background:var(--bg-2); padding:16px 0;
  mask-image:linear-gradient(to right, transparent, black 8%, black 92%, transparent);
  -webkit-mask-image:linear-gradient(to right, transparent, black 8%, black 92%, transparent);
}
.marquee-track{ display:flex; gap:14px; width:max-content; animation:marquee 28s linear infinite; }
@keyframes marquee{ from{ transform:translateX(0); } to{ transform:translateX(-50%); } }
.marquee-chip{
  display:flex; align-items:center; gap:8px; font-family:var(--mono); font-size:12.5px; color:var(--muted);
  border:1px solid var(--border); border-radius:999px; padding:7px 16px; white-space:nowrap; background:var(--bg-3);
}
.marquee-chip .mdot{ width:5px; height:5px; border-radius:50%; background:var(--accent); }

/* Sections */
main{ padding:0 20px; }
.section{ max-width:var(--maxw); margin:0 auto; padding:100px 0; border-bottom:1px solid var(--border); position:relative; }
.section:last-of-type{ border-bottom:none; }
.section-index{ font-family:var(--mono); font-size:12px; color:var(--accent); display:block; margin-bottom:14px; }
h2{ font-size:clamp(26px,4vw,34px); font-weight:700; margin:0 0 26px; }
.lead{ font-size:17px; max-width:62ch; color:var(--text); margin:0; }
.section-hint{ color:var(--muted); font-size:14px; margin:-16px 0 26px; }

/* Reveal */
.reveal{ opacity:0; transform:translateY(26px) scale(.985); transition:opacity .6s ease, transform .6s ease; }
.reveal.show{ opacity:1; transform:none; }

/* About facts */
.fact-list{ display:grid; grid-template-columns:max-content 1fr; gap:12px 28px; margin-top:32px; font-size:14.5px; }
.fact-list dt{ color:var(--muted); font-family:var(--mono); font-size:12.5px; text-transform:uppercase; letter-spacing:.04em; padding-top:2px; }
.fact-list dd{ margin:0; }
.fact-list a{ color:var(--accent); }
.fact-list a:hover{ text-decoration:underline; }

/* Skills */
.skill-row{ margin-bottom:22px; }
.skill-row .label{ display:block; color:var(--muted); font-family:var(--mono); font-size:12px; text-transform:uppercase; letter-spacing:.05em; margin-bottom:10px; }
.skill-pills{ display:flex; flex-wrap:wrap; gap:9px; }
.pill{ padding:8px 16px; border:1px solid var(--border); border-radius:999px; font-size:13.5px; background:var(--bg-2); transition:border-color .15s ease; }
.pill:hover{ border-color:var(--accent); }

/* Project carousel */
.project-carousel{
  display:flex; gap:16px; overflow-x:auto; scroll-snap-type:x mandatory;
  padding-bottom:16px; margin-bottom:8px; -webkit-overflow-scrolling:touch; cursor:grab;
  scrollbar-width:thin; scrollbar-color:var(--border) transparent;
}
.project-carousel:active{ cursor:grabbing; }
.project-carousel::-webkit-scrollbar{ height:5px; }
.project-carousel::-webkit-scrollbar-thumb{ background:var(--border); border-radius:3px; }
.project-card{
  flex:0 0 230px; scroll-snap-align:start; background:var(--bg-2); border:1px solid var(--border);
  border-radius:var(--radius); overflow:hidden; cursor:pointer; transition:border-color .18s ease, transform .18s ease;
}
.project-card:hover{ border-color:var(--accent); transform:translateY(-3px); }
.project-card.active{ border-color:var(--accent-2); }
.project-card .card-body{ padding:18px; }
.project-card .pname{ font-family:var(--display); font-weight:700; display:block; margin-bottom:6px; font-size:16px; }
.project-card .pname .flag{ color:var(--accent); font-size:11px; font-family:var(--mono); font-weight:500; margin-left:8px; }
.project-card p{ color:var(--muted); font-size:13.5px; margin:0 0 12px; }
.project-card .tag-row{ margin-bottom:0; }

.thumb{ aspect-ratio:16/10; overflow:hidden; background:var(--bg-3); border-bottom:1px solid var(--border); }
.thumb img{ width:100%; height:100%; object-fit:cover; display:block; transition:transform .4s ease; }
.project-card:hover .thumb img{ transform:scale(1.08); }
.thumb-placeholder{ display:flex; align-items:center; justify-content:center; }
.thumb-placeholder span{ font-family:var(--display); font-size:34px; font-weight:700; color:var(--accent); }
.detail-thumb{ border-radius:var(--radius) var(--radius) 0 0; aspect-ratio:16/8; margin:-28px -28px 22px; width:calc(100% + 56px); }
.detail-thumb.thumb-placeholder{ background:var(--bg-3); }

.project-detail-panel{
  border:1px solid var(--border); border-radius:var(--radius); padding:28px; background:var(--bg-2);
  overflow:hidden; opacity:0; transform:translateY(8px); transition:opacity .25s ease, transform .25s ease;
}
.project-detail-panel.show{ opacity:1; transform:none; }
.project-detail-panel h3{ font-family:var(--display); margin:0 0 6px; font-size:20px; }
.project-detail-panel .flag{ color:var(--accent); font-size:11px; font-family:var(--mono); margin-left:8px; }
.project-detail-panel p.detail-text{ font-size:14.5px; margin:12px 0 16px; color:var(--text); }
.project-detail-panel ul{ margin:0 0 16px; padding-left:20px; }
.project-detail-panel li{ font-size:14px; margin-bottom:7px; color:var(--muted); }
.tag-row{ display:flex; gap:7px; flex-wrap:wrap; margin-bottom:16px; }
code{ background:var(--bg-3); border:1px solid var(--border); border-radius:5px; padding:3px 8px; font-size:12px; font-family:var(--mono); color:var(--text); }
.plink{ margin-right:18px; font-size:14px; color:var(--accent); }
.plink:hover{ text-decoration:underline; }

.coursework{ margin-top:36px; }
.coursework .label{ color:var(--muted); font-family:var(--mono); font-size:12px; text-transform:uppercase; letter-spacing:.05em; margin:0 0 14px; }
.coursework ul{ list-style:none; margin:0; padding:0; }
.coursework li{ font-size:14.5px; margin-bottom:12px; color:var(--muted); }
.coursework li strong{ color:var(--text); }

/* Changelog */
.changelog-entry{ margin-bottom:30px; padding-bottom:30px; border-bottom:1px solid var(--border); }
.changelog-entry:last-child{ margin-bottom:0; padding-bottom:0; border-bottom:none; }
.changelog-date{ font-family:var(--mono); color:var(--accent); font-size:13px; font-weight:500; margin-bottom:8px; }
.changelog-entry h3{ font-family:var(--display); font-size:17px; margin:0 0 10px; }
.changelog-entry ul{ margin:0; padding-left:20px; }
.changelog-entry li{ font-size:14.5px; margin-bottom:5px; }

/* Connect */
.connect-row{ display:flex; flex-wrap:wrap; gap:12px; }
.connect-card{
  display:flex; flex-direction:column; gap:4px; padding:18px 22px; min-width:150px;
  background:var(--bg-2); border:1px solid var(--border); border-radius:var(--radius);
  transition:border-color .15s ease, transform .15s ease;
}
.connect-card:hover{ border-color:var(--accent); transform:translateY(-2px); }
.connect-card .platform{ font-family:var(--display); font-weight:700; font-size:15px; }
.connect-card .handle{ font-family:var(--mono); font-size:12px; color:var(--muted); }

/* Contact */
.contact-form{ display:flex; flex-direction:column; gap:4px; max-width:460px; }
.contact-form label{ font-family:var(--mono); font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-top:16px; }
.contact-form input, .contact-form textarea{
  background:var(--bg-2); border:1px solid var(--border); color:var(--text);
  font-family:var(--sans); font-size:14.5px; padding:12px 14px; border-radius:10px;
}
.contact-form input:focus, .contact-form textarea:focus{ border-color:var(--accent); outline:none; }
.contact-form button{ margin-top:22px; align-self:flex-start; cursor:pointer; border:none; }
.form-status{ font-size:13px; margin-top:12px; min-height:16px; }
.form-status.ok{ color:#6bd08a; }
.form-status.err{ color:#f0806d; }
.contact-alt{ margin-top:30px; font-size:14.5px; color:var(--muted); }
.contact-alt a{ color:var(--accent); }
.contact-alt a:hover{ text-decoration:underline; }

.site-footer{
  display:flex; gap:20px; color:var(--muted-2); font-size:12px; font-family:var(--mono);
  padding:30px 20px 70px; max-width:var(--maxw); margin:0 auto;
}

</style>
</head>

   ============================================================ */

function renderHero() {
  const [first, ...rest] = DATA.name.split(" ");
  document.getElementById("bigTextA").textContent = first.toUpperCase();
  document.getElementById("bigTextB").textContent = rest.join(" ").toUpperCase();
  document.getElementById("heroDesc").textContent = DATA.heroDesc;
}

function renderAbout() {
  document.getElementById("aboutBio").textContent = DATA.about.bio;
  document.getElementById("factList").innerHTML = DATA.about.facts
    .map((f) => `<dt>${f.label}</dt><dd>${f.value}</dd>`)
    .join("");
}

function renderSkills() {
  document.getElementById("skillRows").innerHTML = Object.entries(DATA.skills)
    .map(
      ([label, items]) => `
      <div class="skill-row">
        <span class="label">${label}</span>
        <div class="skill-pills">${items.map((i) => `<span class="pill">${i}</span>`).join("")}</div>
      </div>`
    )
    .join("");
}

function renderMarquee() {
  const items = Object.values(DATA.skills).flat();
  const chips = items.map((i) => `<span class="marquee-chip"><span class="mdot"></span>${i}</span>`).join("");
  // duplicate once for a seamless loop (track animates -50%)
  document.getElementById("marqueeTrack").innerHTML = chips + chips;
}

/* ------------------------------------------------------------
   Projects: swipeable carousel + shared detail panel
   ------------------------------------------------------------ */

function thumbHTML(p, extraClass) {
  if (p.image) {
    return `<div class="thumb ${extraClass || ""}"><img src="${p.image}" alt="${p.name} screenshot" loading="lazy" onerror="this.parentElement.classList.add('thumb-placeholder');this.remove();" /></div>`;
  }
  return `<div class="thumb thumb-placeholder ${extraClass || ""}"><span>${p.name.charAt(0)}</span></div>`;
}

function renderProjects() {
  const carousel = document.getElementById("projectCarousel");

  carousel.innerHTML = DATA.projects
    .map(
      (p, i) => `
      <div class="project-card" data-index="${i}">
        ${thumbHTML(p)}
        <div class="card-body">
          <span class="pname">${p.name}${p.current ? '<span class="flag">current</span>' : ""}</span>
          <p>${p.description}</p>
          <div class="tag-row">${p.tags.slice(0, 3).map((t) => `<code>${t}</code>`).join("")}</div>
        </div>
      </div>`
    )
    .join("");

  const cards = Array.from(carousel.querySelectorAll(".project-card"));
  cards.forEach((card) => {
    card.addEventListener("click", () => {
      cards.forEach((c) => c.classList.remove("active"));
      card.classList.add("active");
      showProjectDetail(DATA.projects[Number(card.dataset.index)]);
    });
  });

  if (cards.length) {
    cards[0].classList.add("active");
    showProjectDetail(DATA.projects[0]);
  }

  // Mouse drag-to-scroll, so desktop users get the same swipe feel as touch
  let isDown = false, startX = 0, startScroll = 0;
  carousel.addEventListener("mousedown", (e) => { isDown = true; startX = e.pageX; startScroll = carousel.scrollLeft; });
  window.addEventListener("mouseup", () => { isDown = false; });
  carousel.addEventListener("mouseleave", () => { isDown = false; });
  carousel.addEventListener("mousemove", (e) => {
    if (!isDown) return;
    e.preventDefault();
    carousel.scrollLeft = startScroll - (e.pageX - startX);
  });

  document.getElementById("courseworkList").innerHTML = DATA.coursework
    .map((c) => `<li><strong>${c.name}</strong> (${c.tags}) — ${c.note}</li>`)
    .join("");
}

function showProjectDetail(project) {
  const panel = document.getElementById("projectDetailPanel");
  panel.classList.remove("show");
  panel.innerHTML = `
    ${thumbHTML(project, "detail-thumb")}
    <div class="detail-body">
      <h3>${project.name}${project.current ? '<span class="flag">current</span>' : ""}</h3>
      <p class="detail-text">${project.detail}</p>
      <ul>${project.highlights.map((h) => `<li>${h}</li>`).join("")}</ul>
      <div class="tag-row">${project.tags.map((t) => `<code>${t}</code>`).join("")}</div>
      <div class="links">
        ${project.live ? `<a class="plink" href="${project.live}" target="_blank" rel="noopener noreferrer">live demo →</a>` : ""}
        ${project.source ? `<a class="plink" href="${project.source}" target="_blank" rel="noopener noreferrer">source →</a>` : ""}
      </div>
    </div>
  `;
  requestAnimationFrame(() => panel.classList.add("show"));
}

function renderChangelog() {
  document.getElementById("changelogList").innerHTML = DATA.changelog
    .map(
      (e) => `
      <div class="changelog-entry">
        <div class="changelog-date">${e.date}</div>
        <h3>${e.title}</h3>
        <ul>${e.items.map((i) => `<li>${i}</li>`).join("")}</ul>
      </div>`
    )
    .join("");
}

function renderSocial() {
  document.getElementById("connectRow").innerHTML = DATA.social
    .map(
      (s) => `
      <a class="connect-card" href="${s.url}" target="_blank" rel="noopener noreferrer">
        <span class="platform">${s.platform}</span>
        <span class="handle">${s.handle}</span>
      </a>`
    )
    .join("");
}

function renderFooter() {
  document.getElementById("footerLocation").textContent = DATA.location;
  document.getElementById("footerCopy").textContent = `© ${new Date().getFullYear()} ${DATA.name}`;
  document.getElementById("contactAlt").innerHTML = `Prefer email? Write to <a href="mailto:${DATA.email}">${DATA.email}</a>`;
}

/* ============================================================
   Nav: scroll-spy
   ============================================================ */

function initNav() {
  const links = Array.from(document.querySelectorAll(".pill-links a"));
  const sections = links.map((a) => document.getElementById(a.dataset.target)).filter(Boolean);

  const observer = new IntersectionObserver(
    (entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          links.forEach((a) => a.classList.toggle("active", a.dataset.target === entry.target.id));
        }
      });
    },
    { rootMargin: "-40% 0px -55% 0px" }
  );
  sections.forEach((s) => observer.observe(s));
}

/* ============================================================
   Scroll reveal
   ============================================================ */

function initReveal() {
  const els = document.querySelectorAll(".reveal");
  const observer = new IntersectionObserver(
    (entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add("show");
          observer.unobserve(entry.target);
        }
      });
    },
    { threshold: 0.12 }
  );
  els.forEach((el) => observer.observe(el));
}

/* ============================================================
   Hero glow follows the cursor (desktop only, subtle)
   ============================================================ */

function initHeroGlow() {
  const hero = document.getElementById("top");
  const glow = document.getElementById("heroGlow");
  if (!hero || !glow || window.matchMedia("(pointer: coarse)").matches) return;

  hero.addEventListener("mousemove", (e) => {
    const rect = hero.getBoundingClientRect();
    glow.style.left = `${e.clientX - rect.left}px`;
    glow.style.top = `${e.clientY - rect.top}px`;
  });
}

/* ============================================================
   Contact form
   ============================================================ */

function initContactForm() {
  const form = document.getElementById("contactForm");
  const status = document.getElementById("formStatus");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    status.textContent = "Sending…";
    status.className = "form-status";

    try {
      const res = await fetch(FORMSPREE_ENDPOINT, {
        method: "POST",
        body: new FormData(form),
        headers: { Accept: "application/json" }
      });
      if (!res.ok) throw new Error("Form endpoint not ready");
      status.textContent = "Message sent — thanks, I'll reply soon.";
      status.className = "form-status ok";
      form.reset();
    } catch (err) {
      status.textContent = `Couldn't send that yet — please email me directly at ${DATA.email}.`;
      status.className = "form-status err";
    }
  });
}

/* ============================================================
   Init
   ============================================================ */

document.addEventListener("DOMContentLoaded", () => {
  renderHero();
  renderAbout();
  renderSkills();
  renderMarquee();
  renderProjects();
  renderChangelog();
  renderSocial();
  renderFooter();
  initNav();
  initReveal();
  initHeroGlow();
  initContactForm();
});

</script>
</body>
</html>
